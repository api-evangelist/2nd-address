name: 2nd Address
description: >-
  2nd Address (formerly Homesuite) was a Palo Alto, California online marketplace
  for monthly furnished rentals and corporate housing aimed at business travelers,
  relocating professionals, and corporate clients. Founded in 2014 and launched in
  2015 as Homesuite, it rebranded to 2nd Address in November 2017. Operating as a
  licensed real estate broker, it listed thousands of furnished homes for extended,
  month-to-month stays across major U.S. cities, positioning itself against vacation-
  rental platforms by focusing on longer corporate stays. It raised venture funding
  from Battery Ventures, Bessemer Venture Partners, Foundation Capital, and Google
  Ventures. The company never published a public API or developer program, and its
  website (2ndaddress.com) is no longer operational, so this profile is an identity
  record with no API artifacts to enrich.
